[project]
name = "htmlet"
version = "0.1.0"
description = "Tiny self-hostable service that hosts single HTML files at clean public URLs with token-gated uploads."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
# fastapi[standard] bundles the `fastapi` CLI (fastapi run/dev), uvicorn[standard]
# (uvloop/httptools/websockets), and python-multipart — so the launcher and the
# multipart parser come from one declared dependency.
dependencies = [
    "fastapi[standard]>=0.136",
]

[project.scripts]
htmlet = "client.htmlet:main"

# Entrypoint for the FastAPI CLI, so `fastapi run` / `fastapi dev` resolve the app
# without a path argument.
[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "client"]

[tool.hatch.build.targets.wheel.force-include]
"app/templates/index.html" = "app/templates/index.html"
"app/templates/folder.html" = "app/templates/folder.html"
"app/static/favicon.svg" = "app/static/favicon.svg"
"app/static/index.js" = "app/static/index.js"



[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


# Match ruff format (88).
line-length = 88
target-version = "py313"  # keep in sync with requires-python


[tool.ruff.lint]
#https://beta.ruff.rs/docs/rules/
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "G",
    "SIM1",
    "PLE",
    "N802", "N803", "N815", "N816","N806",
    "ANN",
    "C901",
    "UP",  # pyupgrade,
    "T201", # check if print statement exists
    "PLR0915",
    "FAST", # flake8-fastapi (Annotated deps, path-param coverage)
]
ignore = [
    "E501",  # line too long, handled by the formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "G004",
    "ANN003",
    "B904",
    "G201"
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

[tool.ruff.lint.pylint]
max-statements = 500

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"client/htmlet.py" = ["T201"]  # CLI: print IS the output mechanism

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "ty>=0.0.49",
]
